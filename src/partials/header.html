{{> icons}}
<a class="skip" href="#main">Preskoči na sadržaj</a>
<header class="hdr" data-hdr>
  <div class="hdr__in container">
    <a class="logo" href="{{base}}" aria-label="EMSO e-mobility solutions – solarne elektrane, naslovna">
      <svg class="logo__mark" width="38" height="38" aria-hidden="true"><use href="#logo-mark"/></svg>
      <span class="logo__word">EMSO</span>
      <span class="logo__sub">e-mobility<br>solutions</span>
    </a>
    <nav class="nav" id="nav" aria-label="Glavna navigacija">
      <ul class="nav__list">
        <li><a href="{{base}}" {{navActiveSolar}}>Solarne elektrane</a></li>
        <li><a href="{{base}}elektro-punionice/" {{navActiveEv}}>Punionice</a></li>
        <li><a href="{{home}}#kalkulator">Kalkulator</a></li>
        <li><a href="{{base}}poticaji-za-solarne-elektrane-2026/" {{navActivePoticaji}}>Poticaji 2026.</a></li>
        <li><a href="{{home}}#reference">Reference</a></li>
        <li><a href="#kontakt">Kontakt</a></li>
      </ul>
      <div class="nav__mobile">
        <a class="btn btn--sun btn--block" href="#ponuda">Zatražite besplatnu ponudu</a>
        <a class="nav__tel" href="tel:{{c.phoneHref}}"><svg width="20" height="20" aria-hidden="true"><use href="#i-phone"/></svg>{{c.phone}}</a>
        <p class="nav__hours">{{c.hours}} · {{c.email}}</p>
      </div>
    </nav>
    <div class="hdr__cta">
      <a class="hdr__phone" href="tel:{{c.phoneHref}}" aria-label="Nazovite nas: {{c.phone}}">
        <svg width="18" height="18" aria-hidden="true"><use href="#i-phone"/></svg><span>01 2350 655</span>
      </a>
      <a class="btn btn--sun btn--sm hdr__btn" href="#ponuda">Besplatna ponuda</a>
      <button class="burger" type="button" aria-expanded="false" aria-controls="nav" aria-label="Otvori izbornik" data-burger>
        <span></span><span></span>
      </button>
    </div>
  </div>
</header>
