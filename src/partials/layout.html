<!doctype html>
<html lang="hr" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta name="robots" content="{{robots}}">
  <link rel="canonical" href="{{url}}">
  <link rel="alternate" hreflang="hr-HR" href="{{url}}">
  <link rel="alternate" hreflang="x-default" href="{{url}}">
  <meta name="theme-color" content="{{themeColor}}">
  <meta name="author" content="{{c.legalName}}">
  <meta name="geo.region" content="HR-01">
  <meta name="geo.placename" content="{{c.city}}">

  <meta property="og:type" content="{{ogType}}">
  <meta property="og:site_name" content="{{siteName}}">
  <meta property="og:locale" content="{{locale}}">
  <meta property="og:url" content="{{url}}">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:image" content="{{ogImage}}">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="{{ogImageAlt}}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{title}}">
  <meta name="twitter:description" content="{{description}}">
  <meta name="twitter:image" content="{{ogImage}}">

  <link rel="icon" href="{{base}}assets/img/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="{{base}}assets/img/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="{{base}}assets/img/apple-touch-icon.png">
  <link rel="manifest" href="{{base}}site.webmanifest">

  <link rel="preload" href="{{base}}assets/fonts/inter-tight-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{base}}assets/fonts/inter-tight-latin-ext-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  {{preloadImage}}
  <link rel="stylesheet" href="{{base}}assets/css/main.css?v={{buildId}}">
  <script>document.documentElement.className='js'</script>

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "HomeAndConstructionBusiness",
        "@id": "{{siteUrl}}/#organization",
        "name": "{{c.name}}",
        "legalName": "{{c.legalName}}",
        "alternateName": "EMSO",
        "url": "{{siteUrl}}/",
        "logo": { "@type": "ImageObject", "url": "{{siteUrl}}/assets/img/emso-logo-512.png", "width": 512, "height": 512 },
        "image": "{{siteUrl}}/assets/img/og-solarne-elektrane.png",
        "description": "Projektiranje, opremanje i montaža solarnih elektrana i punionica za električna vozila po sistemu ključ u ruke za kućanstva i tvrtke u cijeloj Hrvatskoj.",
        "telephone": "{{c.phone}}",
        "email": "{{c.email}}",
        "taxID": "{{c.oib}}",
        "numberOfEmployees": { "@type": "QuantitativeValue", "value": 17 },
        "foundingLocation": "{{c.city}}",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "{{c.street}}",
          "postalCode": "{{c.postalCode}}",
          "addressLocality": "{{c.city}}",
          "addressRegion": "Zagrebačka županija",
          "addressCountry": "{{c.country}}"
        },
        "hasMap": "{{c.maps}}",
        "openingHoursSpecification": [{
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
          "opens": "08:00",
          "closes": "16:00"
        }],
        "areaServed": { "@type": "Country", "name": "Hrvatska" },
        "priceRange": "€€",
        "award": "Nagrada Zeleni Leptir 2023. – kategorija održiva energija i mobilnost",
        "contactPoint": [
          { "@type": "ContactPoint", "telephone": "{{c.phone}}", "contactType": "customer service", "areaServed": "HR", "availableLanguage": ["hr", "en"] },
          { "@type": "ContactPoint", "telephone": "{{c.mobile}}", "contactType": "sales", "areaServed": "HR", "availableLanguage": ["hr"] }
        ],
        "sameAs": ["{{c.facebook}}", "{{c.instagram}}", "{{c.youtube}}", "https://emso.hr/"],
        "knowsAbout": ["Solarne elektrane", "Fotonaponski sustavi", "Baterijski spremnici energije", "Punionice za električna vozila", "E-mobilnost", "Neto obračun električne energije"]
      },
      {
        "@type": "WebSite",
        "@id": "{{siteUrl}}/#website",
        "url": "{{siteUrl}}/",
        "name": "EMSO – solarne elektrane i punionice",
        "inLanguage": "hr-HR",
        "publisher": { "@id": "{{siteUrl}}/#organization" }
      }
    ]
  }
  </script>
  {{breadcrumbScript}}
  <script type="module" src="{{base}}assets/js/main.js?v={{buildId}}"></script>
  {{pageScripts}}
</head>
<body class="{{bodyClass}}">
{{> header}}
<main id="main">
{{content}}
{{> quote}}
</main>
{{> footer}}
</body>
</html>
